<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>KYS EVENT - QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;text-align:center}
    .wrap{max-width:520px;margin:auto;padding:18px}
    h1{margin:5px 0 4px;font-size:28px}
    .sub{color:#aaa;margin-bottom:15px}
    input,button{width:100%;padding:14px;border-radius:10px;border:0;font-size:16px;margin:6px 0}
    input{background:#222;color:#fff;border:1px solid #444}
    button{background:#fff;color:#111;font-weight:700;cursor:pointer}
    button.stop{background:#d33;color:#fff}
    #reader{width:100%;margin:14px auto;border-radius:14px;overflow:hidden;background:#000}
    #status{min-height:90px;margin-top:14px;padding:18px;border-radius:14px;background:#222;font-size:22px;font-weight:700}
    .small{font-size:13px;color:#aaa;margin-top:10px;line-height:1.4}
    .ok{background:#123f22!important;color:#7dff9b}
    .bad{background:#481515!important;color:#ff8d8d}
    .wait{background:#3d3510!important;color:#ffe27a}
  </style>
</head>
<body>
<div class="wrap">
  <h1>KYS EVENT</h1>
  <div class="sub">QR Entry Scanner</div>

  <input id="volunteer" placeholder="Volunteer Name" autocomplete="off">
  <button id="startBtn" onclick="startScanner()">START SCANNER</button>
  <button id="stopBtn" class="stop" onclick="stopScanner()" style="display:none">STOP SCANNER</button>

  <div id="reader"></div>
  <div id="status">Ready to scan</div>
  <div class="small">Keep the QR inside the box. After a scan, wait for the server result before scanning another ticket.</div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwzmhPRaHzTuSWV9ty-RY8ZAdqOyAkKeqGWvU1FiI-lNVsqRuouRhd7dUd1tTtVOlnr/exec";
const KEY = "KOLbmD4g1LoiBKe6ooZK7LR_OmyBICce";

let scanner = null;
let busy = false;
let lastToken = "";
let lastScanTime = 0;

function setStatus(text, cls="") {
  const el = document.getElementById("status");
  el.className = cls;
  el.textContent = text;
}

async function startScanner() {
  if (scanner) return;

  const volunteer = document.getElementById("volunteer").value.trim();
  if (!volunteer) {
    setStatus("Enter volunteer name first", "bad");
    return;
  }

  setStatus("Starting camera…", "wait");

  scanner = new Html5Qrcode("reader");

  try {
    await scanner.start(
      { facingMode: { exact: "environment" } },
      { fps: 10, qrbox: { width: 270, height: 270 } },
      onScanSuccess,
      () => {}
    );

    document.getElementById("startBtn").style.display = "none";
    document.getElementById("stopBtn").style.display = "block";
    setStatus("READY — Scan QR", "");
  } catch (e) {
    try {
      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 270, height: 270 } },
        onScanSuccess,
        () => {}
      );
      document.getElementById("startBtn").style.display = "none";
      document.getElementById("stopBtn").style.display = "block";
      setStatus("READY — Scan QR", "");
    } catch (err) {
      scanner = null;
      setStatus("Camera could not start. Allow camera permission and reload.", "bad");
    }
  }
}

async function stopScanner() {
  if (!scanner) return;
  try { await scanner.stop(); } catch(e) {}
  try { scanner.clear(); } catch(e) {}
  scanner = null;
  busy = false;
  document.getElementById("startBtn").style.display = "block";
  document.getElementById("stopBtn").style.display = "none";
  setStatus("Scanner stopped", "");
}

function onScanSuccess(decodedText) {
  if (busy) return;

  const token = String(decodedText || "").trim();
  if (!token) return;

  const now = Date.now();
  if (token === lastToken && now - lastScanTime < 5000) return;

  lastToken = token;
  lastScanTime = now;
  busy = true;

  setStatus("VERIFYING TICKET…", "wait");

  const volunteer = document.getElementById("volunteer").value.trim();

  const cb = "kysScan_" + Date.now() + "_" + Math.floor(Math.random()*100000);
  const script = document.createElement("script");
  let finished = false;

  window[cb] = function(result) {
    if (finished) return;
    finished = true;
    cleanup();

    if (!result || !result.status) {
      setStatus("SERVER RETURNED NO RESULT", "bad");
      busy = false;
      return;
    }

    showResult(result);
    busy = false;
  };

  function cleanup() {
    clearTimeout(timeout);
    try { script.remove(); } catch(e) {}
    try { delete window[cb]; } catch(e) {}
  }

  // Long timeout: the ticket server may take several seconds to write the Sheet.
  const timeout = setTimeout(function() {
    if (finished) return;
    finished = true;
    cleanup();

    setStatus("SERVER IS TAKING LONGER THAN USUAL — DO NOT RESCAN YET", "wait");

    // Give the first request extra time to finish before allowing another scan.
    setTimeout(function() {
      busy = false;
      setStatus("READY — Scan next QR", "");
    }, 5000);
  }, 30000);

  const url =
    API +
    "?api=checkin_jsonp" +
    "&callback=" + encodeURIComponent(cb) +
    "&key=" + encodeURIComponent(KEY) +
    "&token=" + encodeURIComponent(token) +
    "&volunteer=" + encodeURIComponent(volunteer) +
    "&_=" + Date.now();

  script.src = url;
  script.async = true;
  script.onerror = function() {
    if (finished) return;
    // Do NOT immediately call it an internet error.
    setStatus("CONTACTING TICKET SERVER…", "wait");
  };

  document.body.appendChild(script);
}

function showResult(r) {
  const status = String(r.status || "").toUpperCase();

  if (status === "USED") {
    setStatus(
      "ALREADY CHECKED IN" +
      (r.name ? "\n" + r.name : ""),
      "bad"
    );
    return;
  }

  if (status === "VALID" || status === "SUCCESS" || status === "USED_OK") {
    setStatus(
      "ENTRY ALLOWED" +
      (r.name ? "\n" + r.name : ""),
      "ok"
    );
    return;
  }

  if (r.ok === true && /ENTRY ALLOWED/i.test(String(r.message || ""))) {
    setStatus(
      "ENTRY ALLOWED" +
      (r.name ? "\n" + r.name : ""),
      "ok"
    );
    return;
  }

  setStatus(
    String(r.message || "TICKET NOT VALID"),
    "bad"
  );
}
</script>
</body>
</html>
